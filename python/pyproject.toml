[project]
name = "cmdop"
version = "3.4.0"
description = "Your machines' tools from a program: the same tools agents use through MCP, typed from Rust."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# The core stays two libraries (developer SDK plan, section 3): a carrier needing a runtime of its own is an extra.
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://cmdop.ai"
Documentation = "https://docs.cmdop.ai/reference/sdk/python"
Source = "https://github.com/commandoperator/cmdop-sdk"
Issues = "https://github.com/commandoperator/cmdop-sdk/issues"

[project.optional-dependencies]
dev = ["pytest>=8.3", "pyright>=1.1.400", "cryptography>=44"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmdop"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
# Generated models are checked by their own generator; the methods that use them are checked here.
exclude = [
  "src/cmdop/generated/args.py", "src/cmdop/generated/models.py", "src/cmdop/generated/call.py",
  "src/cmdop/generated/server_args.py", "src/cmdop/generated/server_models.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
